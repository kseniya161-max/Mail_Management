{% extends 'base.html' %}
{% block title %} Удаление  клиента {% endblock %}
{% block content %}
<div class="container mt-3">
    <button onclick="history.back()" class="btn btn-outline-custom btn-sm me-3">
        ← Назад
    </button>

<h4 class="mt-3 mb-2">Удаление клиента</h4>
<p>Вы уверены что хотите удалить клиента "{{ object.name }}"?</p>
<form method="post">
    {% csrf_token %}

    <button type="submit" class="btn-save btn-sm mt-3 mb-3">Удалить</button>
    <a href="{% url 'clients:client_list' %}" class="btn btn-outline-custom btn-sm mt-3 mb-3">Отмена</a>
</form>
    </div>
{% endblock %}
