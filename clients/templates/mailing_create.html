{% extends 'base.html' %}
{% block title %} Создание рассылки {% endblock %}
{% block content %}

<div class="container mt-3">
    <button onclick="history.back()" class="btn btn-outline-custom me-3">
        ← Назад
    </button>
</div>
<h2 class="mt-3 mb-2">Создание Рассылок</h2>
<form method="post" novalidate>
    {% csrf_token %}
    {{ form.non_field_errors }}
    {{ form.as_p }}


    <button type="submit" class="btn btn-outline-custom btn-sm mt-3 mb-3">Сохранить</button>
    <a href="{% url 'clients:mailing_list' %}" class="btn btn-outline-custom btn-sm mt-3 mb-3">Отмена</a>
</form>

{% endblock %}
