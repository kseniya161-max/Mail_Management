{% extends 'base.html' %}
{% block title %} Создание категории {% endblock %}
{% block content %}
<div class="container mt-3">
    <button onclick="history.back()" class="btn btn-outline-custom me-3">
        ← Назад
    </button>
</div>


<h3 class="mt-3 mb-2">Создание категории</h3>
<form method="post" enctype="multipart/form-data" novalidate>
    {% csrf_token %}
    {{ form.as_p }}

    <button type="submit" class="btn btn-outline-custom btn-sm mt-3 mb-3">Сохранить</button>
    <a href="{% url 'products:category_list' %}" class="btn btn-outline-custom btn-sm mt-3 mb-3">Отмена</a>
</form>

{% endblock %}
