{% extends 'base.html' %}
{% block title %} Удаление продукта {% endblock %}
{% block content %}
<h3 class="mt-3 mb-2">Удаление продукта</h3>
<p>Вы уверены что хотите удалить продукт"{{ object.name }}"?</p>
<form method="post">
    {% csrf_token %}

    <button type="submit" class="btn btn-outline-custom btn-sm mt-3 mb-3" style="border: 1px solid red;">Удалить</button>
    <a href="{% url 'products:product_list' %}" class="btn btn-outline-custom btn-sm mt-3 mb-3">Отмена</a>
</form>
{% endblock %}
