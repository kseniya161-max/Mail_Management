{% extends 'base.html' %}
{% block title %} Удаление продукта {% endblock %}
{% block content %}
<div class="container mt-3">
    <button onclick="history.back()" class="btn btn-outline-custom btn-sm me-3">
        ← Назад
    </button>

<h4 class="mt-3 mb-2">Удаление продукта</h4>
<p>Вы уверены что хотите удалить товар"{{ object.name }}"? После удаления он больше не будет доступен</p>
<form method="post">
    {% csrf_token %}

    <button type="submit" class="btn btn-outline-custom btn-sm mt-3 mb-3">Удалить</button>
    <a href="{% url 'products:product_list' %}" class="btn btn-outline-custom btn-sm mt-3 mb-3">Отмена</a>
</form>
    </div>
{% endblock %}
