{% extends 'base.html' %}
{% block title %} Удаление  категории {% endblock %}
{% block content %}
<div class="container mt-3">
    <button onclick="history.back()" class="btn btn-outline-custom btn-sm me-3">
        ← Назад
    </button>
<h4 class="mt-3 mb-2">Удаление категории</h4>
<p>Вы уверены что хотите удалить категорию"{{ object.name }}"?</p>
<form method="post">
    {% csrf_token %}

    <button type="submit" class="btn btn-outline-custom btn-sm">Удалить</button>
    <a href="{% url 'products:category_list' %}" class="btn btn-outline-custom btn-sm mt-3 mb-3">Отмена</a>
</form>
    </div>
{% endblock %}
