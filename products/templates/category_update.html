{% extends 'base.html' %}
{% block title %} Редактирование Категории {% endblock %}
{% block content %}
<div class="container mt-3">
    <button onclick="history.back()" class="btn btn-outline-custom btn-sm me-3">
        ← Назад
    </button>

<h4 class="mt-3 mb-2">Редактирование Категории товара {{ category.name }}</h4>


<form method="post" novalidate>
    {% csrf_token %}
    {{form.as_p}}

    <button type="submit" class="btn-save btn-sm mt-3 mb-3">Сохранить изменения</button>
    <a href="{% url 'products:category_list' %}" class="btn btn-outline-custom btn-sm mt-3 mb-3">Отмена</a>
</form>
</div>
{% endblock %}
